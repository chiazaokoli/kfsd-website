name: Unpublish retired GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unpublish-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Delete GitHub Pages site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/pages"
